<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mock StartNG Portal (dev only)</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0b1020; color: #fff; margin: 0; padding: 16px; }
  .wrap { display: grid; grid-template-columns: 300px 1fr; gap: 16px; }
  .panel { background: #141b33; border-radius: 12px; padding: 16px; }
  iframe { width: 100%; height: 80vh; border: 2px solid #7b61ff; border-radius: 12px; background: #000; }
  button { display: block; width: 100%; margin: 8px 0; padding: 10px; border-radius: 8px; border: none; cursor: pointer; font-weight: 700; }
  .log { font-size: 12px; background: #000; border-radius: 8px; padding: 8px; height: 160px; overflow-y: auto; }
</style>
</head>
<body>
<h1>Mock StartNG Portal — T3 iframe test harness (DEV only)</h1>
<p>Game: <code>?dev=1</code> enables DEV paths. Portal posts are origin-checked in production; here same-origin localhost is trusted via DEV.</p>
<div class="wrap">
  <div class="panel">
    <button id="login">1. Send STARTNG:USER (Ada)</button>
    <button id="theme1">2. Push THEME: Lagos red</button>
    <button id="theme2">Push THEME: lagoon + box shape</button>
    <button id="theme3">Push THEME: low-contrast (guard test)</button>
    <button id="lose">Session lost mid-run</button>
    <div class="log" id="log"></div>
  </div>
  <iframe id="game" src="index.html?dev=1"></iframe>
</div>
<script>
  const frame = document.getElementById('game');
  const log = (m) => { const d = document.createElement('div'); d.textContent = m; document.getElementById('log').appendChild(d); };
  addEventListener('message', (e) => { log('<- ' + (e.data?.type || '?') + ' from ' + e.origin); });
  const post = (msg) => { frame.contentWindow.postMessage(msg, '*'); log('-> ' + msg.type); };
  document.getElementById('login').onclick = () => post({ type: 'STARTNG:USER', user: { id: 'u-ada', username: 'Ada', displayName: 'Ada <Grid>', avatar: null } });
  document.getElementById('theme1').onclick = () => post({ type: 'STARTNG:THEME', theme: { primary: '#ff0044', accent: '#ffcc00' } });
  document.getElementById('theme2').onclick = () => post({ type: 'STARTNG:THEME', theme: { primary: '#00b8d4', accent: '#ff4081', shape: 'box' } });
  document.getElementById('theme3').onclick = () => post({ type: 'STARTNG:THEME', theme: { primary: '#141b33', accent: '#00e5ff' } });
  document.getElementById('lose').onclick = () => post({ type: 'STARTNG:SESSION_LOST' });
</script>
</body>
</html>
